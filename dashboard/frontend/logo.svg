<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background / Shield Gradients -->
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2329" />
      <stop offset="50%" stop-color="#14171c" />
      <stop offset="100%" stop-color="#0b0e11" />
    </linearGradient>

    <!-- Binance Gold Gradient -->
    <linearGradient id="binanceGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD535" />
      <stop offset="50%" stop-color="#F0B90B" />
      <stop offset="100%" stop-color="#C99400" />
    </linearGradient>

    <!-- Accent Emerald/Cyber Neon Gradient -->
    <linearGradient id="cyberGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0ECB81" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <!-- Shield Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD535" />
      <stop offset="40%" stop-color="#F0B90B" />
      <stop offset="80%" stop-color="#30363d" />
      <stop offset="100%" stop-color="#181a20" />
    </linearGradient>

    <!-- Drop Shadow & Neon Glow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#F0B90B" flood-opacity="0.45" />
    </filter>
    <filter id="shieldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Outer Protective Shield -->
  <path d="M 64 10 
           L 112 28 
           C 112 78, 88 108, 64 118 
           C 40 108, 16 78, 16 28 
           Z" 
        fill="url(#shieldBg)" 
        stroke="url(#borderGrad)" 
        stroke-width="3" 
        stroke-linejoin="round"
        filter="url(#shieldShadow)" />

  <!-- Inner Cyber Tech Rim -->
  <path d="M 64 18 
           L 104 33 
           C 104 74, 82 100, 64 109 
           C 46 100, 24 74, 24 33 
           Z" 
        fill="none" 
        stroke="#2b313a" 
        stroke-width="1.5" 
        stroke-dasharray="6 3" />

  <!-- Sentinel Scanning Tech Arc (Top) -->
  <path d="M 44 26 L 64 20 L 84 26" 
        fill="none" 
        stroke="url(#cyberGlow)" 
        stroke-width="2" 
        stroke-linecap="round" />

  <!-- Central Binance & Sentinel Diamond Nexus -->
  <g filter="url(#goldGlow)">
    <!-- Top Central Rhombus -->
    <polygon points="64,36 73,45 64,54 55,45" fill="url(#binanceGold)" />

    <!-- Left Rhombus -->
    <polygon points="46,54 55,63 46,72 37,63" fill="url(#binanceGold)" />

    <!-- Right Rhombus -->
    <polygon points="82,54 91,63 82,72 73,63" fill="url(#binanceGold)" />

    <!-- Central Core Nexus (Sentinel AI Eye / Core Diamond) -->
    <polygon points="64,56 75,67 64,78 53,67" fill="#ffffff" opacity="0.95" />
    <polygon points="64,58 72,66 64,74 56,66" fill="url(#binanceGold)" />

    <!-- Bottom Shield Anchor Diamond -->
    <polygon points="64,80 73,89 64,98 55,89" fill="url(#binanceGold)" />
  </g>

  <!-- Cyber Circuit Interconnects -->
  <line x1="64" y1="20" x2="64" y2="34" stroke="url(#binanceGold)" stroke-width="1.5" opacity="0.8" />
  <line x1="64" y1="99" x2="64" y2="108" stroke="url(#binanceGold)" stroke-width="1.5" opacity="0.8" />
  <circle cx="64" cy="108" r="2" fill="#F0B90B" />

  <line x1="34" y1="63" x2="25" y2="63" stroke="#0ECB81" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
  <line x1="94" y1="63" x2="103" y2="63" stroke="#0ECB81" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
</svg>
